<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avengers</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #222;
            color: #fff;
            margin: 0;
            padding: 0;
        }
        header {
            background: #b71c1c;
            padding: 1em 0;
            text-align: center;
        }
        h1 {
            margin: 0;
            font-size: 2.5em;
            letter-spacing: 2px;
        }
        main {
            padding: 2em;
            max-width: 800px;
            margin: auto;
        }
        ul {
            list-style: none;
            padding: 0;
        }
        li {
            background: #333;
            margin: 1em 0;
            padding: 1em;
            border-radius: 8px;
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <header>
        <h1>Los Vengadores by Fher</h1>
    </header>
    <main>
        <h2>Miembros principales</h2>
        <ul>
            <li>Iron Man</li>
            <li>Capitán América</li>
            <li>Thor</li>
            <li>Hulk</li>
            <li>Black Widow</li>
            <li>Hawkeye</li>
        </ul>
    </main>
    <script src="./js/app.js"></script>
</body>
</html>
